services:
  - type: web
    name: flint-api
    runtime: python
    buildCommand: pip install uv && uv sync
    startCommand: uvicorn flint.api.app:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    plan: free
    envVars:
      # LLM — free by default (Groq). Paste GROQ_API_KEY in the dashboard.
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY   # optional free alternative
        sync: false
      - key: ANTHROPIC_API_KEY   # optional (paid); only needed for AGENT tasks
        sync: false
      # Auto-generate a strong JWT secret so the prod boot guard is satisfied.
      - key: FLINT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL   # optional — Flint falls back to in-memory if unset/down
        sync: false
      - key: FLINT_ENV
        value: production
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: localhost:9092
